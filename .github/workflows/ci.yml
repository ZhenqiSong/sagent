name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # 确保 CI 中不使用用户本地配置
  SAGENT_HOME: ""
  # 黑盒 PTY 需要一个明确的终端类型；非交互 runner 默认可能不提供 TERM。
  TERM: xterm-256color

jobs:
  # ── 代码质量和测试（Linux/macOS/Windows） ──
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-quality-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --workspace --all-targets

      - name: Run workspace tests except TUI black-box
        # 先完成其他 crate，避免 workspace 测试编排影响 TUI 黑盒依赖的兄弟 binary。
        run: cargo test --workspace -- --test-threads=1

      - name: Run TUI unit tests
        run: cargo test -p sagent-tui --bin sagent-tui -- --test-threads=1

      # 黑盒 TUI 会从 target/debug 启动真实的 TUI/RPC 可执行文件；最后重新构建，
      # 确保 cargo test 的测试编排不会覆盖 sagent-rpc 运行时入口。
      - name: Build runtime binaries for black-box tests
        run: cargo build --workspace --bins

      - name: Run TUI black-box tests
        # 将 PTY 黑盒串行化，避免三个真实终端同时竞争 runner 的伪终端资源。
        run: cargo test -p sagent-tui --test blackbox_e2e -- --test-threads=1

      # 契约 fixture 保护跨 crate 的外部行为；它不依赖用户 home、网络或真实凭据，
      # 因而必须与普通单元测试一起在每个原生 OS 上执行。
      - name: Run behavior contracts
        run: cargo run -p sagent-contracts

      # 这一测试在 Windows 实际走 Job Object，在 macOS/Linux 实际走 process group。
      # 不通过模拟 cfg 或交叉编译代替宿主进程树生命周期验证。
      - name: Verify native terminal process supervision
        run: cargo test -p sagent-tools --test terminal

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify workspace metadata
        run: cargo metadata --no-deps --format-version 1

  # ── 各宿主平台目标编译检查 ──
  cross-check:
    name: Cross Check (${{ matrix.target }})
    # bundled SQLite、ring 等依赖需要宿主 C 工具链；在 Ubuntu 上交叉链接 Apple/MSVC
    # 目标并不能证明可编译，反而会因缺少对应 linker 产生误报。每个目标在原生 runner 上
    # 检查，真正的跨平台行为仍由 quality matrix 的原生测试覆盖。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-cross-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cross-${{ matrix.target }}-

      - name: Check compilation for ${{ matrix.target }}
        run: cargo check --workspace --target ${{ matrix.target }}

  # ── 依赖审计（cargo-deny） ──
  deny:
    name: Dependency Audit (deny)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        # 仅审计发布图；dev-dependencies（如真实 PTY 测试工具）不随产品分发。
        run: cargo deny --exclude-dev check

  # ── 安全审计（cargo-audit） ──
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
