[package]
name = "sagent-rpc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sagent-rpc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
sagent-config = { path = "../sagent-config" }
sagent-protocol = { path = "../sagent-protocol" }
sagent-store = { path = "../sagent-store" }
sagent-types = { path = "../sagent-types" }

[dev-dependencies]
