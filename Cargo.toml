[workspace]
members = ["crates/*", "bins/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
# 序列化（Phase 0 仅需 serde + serde_json）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
thiserror = "2"

# 日志（仅 stderr，不污染 stdout 协议通道）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
