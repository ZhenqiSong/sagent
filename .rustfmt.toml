# Sagent 项目 rustfmt 配置
# Phase 0 最小配置，仅包含 stable channel 支持的选项

# 使用 2021 edition 的格式规则
edition = "2021"

# 最大行宽
max_width = 100

# 使用空格缩进
hard_tabs = false
tab_spaces = 4

# 表达式链式调用缩进
chain_width = 80

# 结构体字段初始化简写
use_field_init_shorthand = true

# match 分支尾部逗号
match_block_trailing_comma = true

# 重新排序 import 和 module
reorder_imports = true
reorder_modules = true

# 文件末尾换行风格
newline_style = "Unix"
