[workspace]
resolver="2"
members = [
    "crates/sagent-cli",
    "crates/sagent-store",
    "crates/sagent-types",
    "crates/sagent-config",
    "crates/sagent-protocol",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow="1"
serde={version="1", features=["derive"]}
serde_json="1"
serde_yaml="0.9"
thiserror="2"
uuid={version="1", features=["v4"]}
