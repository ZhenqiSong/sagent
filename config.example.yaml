# Sagent Phase 1 配置示例。
# 配置文件路径：<SAGENT_HOME>/config.yaml。

version: 1
runtime:
  shutdown_timeout_ms: 5000
  max_live_sessions: 128
  actor_mailbox_capacity: 256
  event_buffer_capacity: 256
database:
  path: null
  busy_timeout_ms: 5000
  synchronous: full
rpc:
  max_line_bytes: 1048576
  max_response_bytes: 4194304
logging:
  level: info
