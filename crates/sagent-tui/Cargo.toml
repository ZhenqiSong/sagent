[package]
name = "sagent-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sagent-tui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sagent-protocol = { path = "../sagent-protocol" }
sagent-types = { path = "../sagent-types" }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
futures-util = "0.3"
unicode-width = "0.2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
# 黑盒测试必须提供真实 PTY；普通 pipe 不会触发 raw mode/alternate screen 的终端路径。
portable-pty = ">=0.9,<0.10"
sagent-provider = { path = "../sagent-provider" }
sagent-store = { path = "../sagent-store" }
sysinfo = { version = ">=0.38,<0.40", default-features = false, features = ["system"] }
